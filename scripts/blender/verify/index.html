<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Zemi models check</title>
<style>
  body { margin: 0; background: #fff; font: 12px/1.3 ui-monospace, monospace; color: #0e1116; }
  #grid { display: grid; grid-template-columns: repeat(3, 360px); gap: 8px; padding: 8px; }
  figure { margin: 0; } img { width: 360px; height: 360px; display: block; } figcaption { padding: 2px 4px; }
</style>
<script type="importmap">
  { "imports": { "three": "/apps/web/node_modules/three/build/three.module.js", "three/addons/": "/apps/web/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="grid"></div>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const manifest = await (await fetch('/apps/web/public/models/manifest.json')).json();
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(720, 720);
  renderer.setClearColor(0xffffff, 1);
  renderer.toneMapping = THREE.NeutralToneMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
  const report = [];
  for (const m of manifest.models) {
    const gltf = await loader.loadAsync('/apps/web/public' + m.file);
    const scene = new THREE.Scene();
    scene.environment = env;
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(-1, 2, 1.5);
    scene.add(sun);
    scene.add(gltf.scene);
    const names = [];
    gltf.scene.traverse((o) => names.push(o.name));
    if (m.id === 'wall-clock') {
      const h = gltf.scene.getObjectByName('hour_hand');
      const mi = gltf.scene.getObjectByName('minute_hand');
      h.rotation.z = -((13 % 12) + 15 / 60) / 12 * Math.PI * 2;
      mi.rotation.z = -(15 / 60) * Math.PI * 2;
    }
    const box = new THREE.Box3().setFromObject(gltf.scene, true);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const r = size.length() / 2;
    const cam = new THREE.PerspectiveCamera(30, 1, r / 100, r * 100);
    const dir = m.id === 'wall-clock' ? new THREE.Vector3(0.15, 0.2, 1) : new THREE.Vector3(0.9, 0.7, 1.2);
    cam.position.copy(center).add(dir.normalize().multiplyScalar(r / Math.sin(THREE.MathUtils.degToRad(15)) * 1.05));
    cam.lookAt(center);
    renderer.render(scene, cam);
    const fig = document.createElement('figure');
    const img = new Image();
    img.src = renderer.domElement.toDataURL('image/png');
    const cap = document.createElement('figcaption');
    cap.textContent = `${m.id}  ${m.kilobytes} KB  min.y=${box.min.y.toFixed(3)} cx=${center.x.toFixed(3)} cz=${center.z.toFixed(3)}`;
    fig.append(img, cap);
    document.getElementById('grid').append(fig);
    report.push({ id: m.id, minY: box.min.y, cx: center.x, cz: center.z, size: size.toArray(), hasAll: m.nodes.every((n) => names.includes(n)) });
  }
  window.__report = report;
  document.body.dataset.done = '1';
</script>
</body>
</html>
